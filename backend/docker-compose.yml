services:
  app:
    build: .
    container_name: kstudy_app
    restart: always
    ports:
      - "127.0.0.1:8000:8000"  # 只綁定本機，外部無法直接存取
    env_file:
      - .env.prod  # 從 .env.prod 讀取機密設定，不寫死在這裡
    environment:
      - TZ=Asia/Taipei
    depends_on:
      - db
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    container_name: kstudy_db
    restart: always
    env_file:
      - .env.prod  # 從同一個 .env.prod 讀取 POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    environment:
      - TZ=Asia/Taipei
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: kstudy_redis
    restart: always
    environment:
      - TZ=Asia/Taipei
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.30.1-alpine  # 已修補 CVE-2026-42945 (NGINX Rift RCE)
    container_name: kstudy_nginx
    restart: always
    environment:
      - TZ=Asia/Taipei
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ../dist:/usr/share/nginx/html:ro  # 前端 build 產物
    depends_on:
      - app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: kstudy_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
