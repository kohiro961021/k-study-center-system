user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting: 10 requests per second per IP, burst up to 20
    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=10r/s;

    upstream app_server {
        server app:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";

        # 404 Disguise for Admin Routes
        # If non-admin tries to access /api/admin, the backend handles the 404 logic,
        # but Nginx can also help if needed. Here we rely on the backend app logic as requested.

        location / {
            # Header Verification Shield
            if ($http_x_klib_key != "test") {
                return 404;
            }

            # Rate Limiting
            limit_req zone=ip_limit burst=20 nodelay;

            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
