user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting: 10 requests per second per IP, burst up to 20
    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=10r/s;

    upstream app_server {
        server app:8000;
    }

    server {
        listen 80;
        server_name kbook.fssh.khc.edu.tw localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name kbook.fssh.khc.edu.tw localhost;

        ssl_certificate /etc/letsencrypt/live/kbook.fssh.khc.edu.tw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kbook.fssh.khc.edu.tw/privkey.pem;

        # Recommended SSL Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            # Header Verification Shield
            # 注意：前端的 KLIB_KEY 常數必須與此處的值一致
            if ($http_x_klib_key != "Fs2026-KLib-9xmP7nQr2vBs-FsSh") {
                return 404;
            }

            # Rate Limiting
            limit_req zone=ip_limit burst=20 nodelay;

            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
